name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, front]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tech-blog-neo-${{ matrix.app }}
          platforms: linux/amd64
          push: true
          build-args: NEXT_PUBLIC_API_URL=https://${{ vars.DOMAIN }}/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tech-blog-neo-${{ matrix.app }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tech-blog-neo-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.yml,tech-blog-neo-api/db
          target: tech-blog-neo # EC2 사용자 홈 기준
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/tech-blog-neo/deploy
            docker compose pull api front
            docker compose up -d --remove-orphans
            docker image prune -f
