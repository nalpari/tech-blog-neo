# EC2 의 ~/tech-blog-neo/deploy 에서 실행한다. 값은 같은 폴더의 .env (.env.example 참고).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
      # 빈 볼륨으로 처음 뜰 때만 실행된다. 이후 마이그레이션은 수동으로 적용한다.
      - ../tech-blog-neo-api/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    image: ${DOCKERHUB_USERNAME}/tech-blog-neo-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FRONT_URL: https://${DOMAIN}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/auth/google/callback
    # 호스트 nginx 만 붙도록 루프백에만 연다. 브라우저는 nginx 의 /api/ 로 들어온다.
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      db:
        condition: service_healthy

  front:
    image: ${DOCKERHUB_USERNAME}/tech-blog-neo-front:latest
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
