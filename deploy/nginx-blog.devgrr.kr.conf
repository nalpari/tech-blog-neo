# EC2 의 /etc/nginx/sites-available/blog.devgrr.kr 에 둔다. HTTPS 는 certbot --nginx 가 덧붙인다.
# 프론트와 API 를 한 도메인에 둔다. 세션 쿠키가 호스트 단위라서
# api.<도메인> 처럼 나누면 프론트 서버가 쿠키를 받지 못한다.
server {
    listen 80;
    listen [::]:80;
    server_name blog.devgrr.kr;
    client_max_body_size 30M;

    # 끝의 / 가 /api 접두사를 떼고 API 로 넘긴다.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
